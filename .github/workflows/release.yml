name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build & Release
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Archive app
        run: |
          ditto -c -k --keepParent MacMonitor.app MacMonitor.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MacMonitor.zip
          generate_release_notes: true
